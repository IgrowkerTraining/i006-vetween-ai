services:
  vetween-ai-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vetween-ai-service
    ports:
      - "8000:8000"
    environment:
      # AI Providers
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_API_URL=${NVIDIA_API_URL:-https://integrate.api.nvidia.com/v1}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      
      # Database (Supabase)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      
      # FastAPI Settings
      - APP_NAME=${APP_NAME:-Vetween-Backend-IA}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - DEBUG=${DEBUG:-false}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      # Verificación de salud usando tu endpoint de diagnóstico
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

